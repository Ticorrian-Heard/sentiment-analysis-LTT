<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom VideoSDK Transcript Sentiment Analysis</title>
</head>

<body class="flex flex-1 flex-col h-full min-h-screen relative">
  <h1 class="text-3xl font-bold text-center my-4">Zoom VideoSDK Closed Captions</h1>
  <div class="flex flex-row self-center">
    <button id="start-btn" class="bg-blue-500 text-white font-bold py-2 px-4 rounded mb-4 w-64 hover:bg-blue-600 active:bg-blue-700 self-center">
      Join
    </button>
    <div id="ai-form" class="hidden flex flex-col self-center">
        <div>       
          <input type="range" id="sample-size" name="sample-size" min="1" max="500" value="250" class="w-64">
          <span id="sample-size-output">Training Sample Size: 250</span>
        </div>

        <div>
          <input type="range" id="epochs" name="epochs" min="1" max="100" value="50"  class="w-64">
          <span id="epochs-output">Epochs: 50</span>
        </div>
        
        <button id="ai-btn" class="bg-blue-500 text-white font-bold py-2 px-4 rounded mb-4 w-64 hover:bg-blue-600 active:bg-blue-700 self-center">
         Reset AI 
        </button>
        <button id="share-btn" class="bg-blue-500 text-white font-bold py-2 px-4 rounded mb-4 w-64 hover:bg-blue-600 active:bg-blue-700 self-center">
          Share Screen
        </button>
        <button id="stop-btn" class="bg-blue-500 text-white font-bold py-2 px-4 rounded mb-4 w-64 hover:bg-blue-600 active:bg-blue-700 self-center">
          Leave
        </button>

        <div class="flex w-full justify-center">
          <span id="sentiment" class="font-bold py-2 px-4 mb-4">Detected Sentiment: </span>
        </div>
     </div>
  </div>

  <video class="flex flex-row self-center m-2 h-96 hidden max-w-[65rem] max-h-[65rem]"
    id="my-screen-share-content-video" height="1080" width="1920"></video>
  <canvas class="flex flex-row self-center m-2 h-96 hidden max-w-[65rem] max-h-[65rem]"
    id="my-screen-share-content-canvas" height="1080" width="1920"></canvas>
  <canvas class="flex flex-row self-center m-2 h-96 hidden max-w-[65rem] max-h-[65rem]"
    id="users-screen-share-content-canvas" height="1080" width="1920"></canvas>
  <video-player-container class="max-w-[65rem] max-h-[65rem]"></video-player-container>
  <div class="text-center absolute bottom-2 w-full">
    Do not expose your SDK Secret to the client, when using this in production
    please make sure to use a backend service to sign tokens.
  </div>
  <!-- <script src="/coi-serviceworker.js"></script> -->
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
